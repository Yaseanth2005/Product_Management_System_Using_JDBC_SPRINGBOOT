<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            border-radius: 24px 24px 0 0;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 40px;
            font-size: 16px;
            font-weight: 400;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            list-style: none;
        }

        .menu-item {
            position: relative;
            overflow: hidden;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 24px;
            background: #ffffff;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            text-decoration: none;
            color: #374151;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .menu-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: left 0.5s;
        }

        .menu-link:hover::before {
            left: 100%;
        }

        .menu-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
            color: #667eea;
        }

        .menu-link:active {
            transform: translateY(0);
        }

        .icon {
            font-size: 20px;
            min-width: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-product { border-left: 4px solid #10b981; }
        .update-product { border-left: 4px solid #3b82f6; }
        .delete-product { border-left: 4px solid #ef4444; }
        .view-by-id { border-left: 4px solid #8b5cf6; }
        .view-all { border-left: 4px solid #f59e0b; }

        .add-product:hover { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); }
        .update-product:hover { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
        .delete-product:hover { background: linear-gradient(135deg, #fef2f2 0%, #fecaca 100%); }
        .view-by-id:hover { background: linear-gradient(135deg, #f5f3ff 0%, #e7e5ff 100%); }
        .view-all:hover { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            animation: float 6s ease-in-out infinite;
        }

        .floating-circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 80%;
            animation-delay: 0s;
        }

        .floating-circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 10%;
            animation-delay: 2s;
        }

        .floating-circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 30%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
                margin: 16px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Pulse animation for visual feedback */
        .menu-link:focus {
            outline: none;
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
    </div>

    <div class="container">
        <h1>Product Hub</h1>
        <p class="subtitle">Manage your products with ease</p>
        
        <ul class="menu-grid">
            <li class="menu-item">
                <a href="addproduct.html" class="menu-link add-product">
                    <span class="icon">+</span>
                    <span>Add Product</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="updateproduct.html" class="menu-link update-product">
                    <span class="icon">↻</span>
                    <span>Update Product</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="deleteproduct.html" class="menu-link delete-product">
                    <span class="icon">×</span>
                    <span>Delete Product</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="viewproductbyid.html" class="menu-link view-by-id">
                    <span class="icon">🔍</span>
                    <span>View by ID</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="viewallproducts.html" class="menu-link view-all">
                    <span class="icon">☰</span>
                    <span>View All</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
        // Add interactive feedback
        document.querySelectorAll('.menu-link').forEach(link => {
            link.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px) scale(1.02)';
            });
            
            link.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
            
            link.addEventListener('click', function(e) {
                // Create ripple effect
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.6)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.pointerEvents = 'none';
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
