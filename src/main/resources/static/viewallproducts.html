<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View All Products</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        th, td {
            padding: 12px 18px;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #000;
            color: #fff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #noData {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }

        .home-link {
            text-align: center;
            margin-top: 20px;
        }

        .home-link a {
            text-decoration: none;
            background-color: #000;
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .home-link a:hover {
            background-color: #ff6600;
        }
    </style>
</head>
<body onload="viewAll()">
    <h1>📋 All Products</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
    </table>

    <div id="noData"></div>

    <div class="home-link">
        <a href="index.html">⬅️ Back to Dashboard</a>
    </div>

    <script src="js/viewproducts.js"></script>
</body>
</html>
